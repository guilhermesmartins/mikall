[workspace]
resolver = "2"
members = [
    "crates/mikall-domain",
    "crates/mikall-app",
    "crates/mikall-bdd",
    "crates/mikall-crypto",
    "crates/mikall-net",
    "crates/mikall-store",
    "crates/mikall-node",
    "crates/mikall-irc",
    "crates/mikall-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guilhermesmartins/mikall"
rust-version = "1.85"

[workspace.dependencies]
mikall-domain = { path = "crates/mikall-domain" }
mikall-app = { path = "crates/mikall-app" }
mikall-crypto = { path = "crates/mikall-crypto" }
mikall-net = { path = "crates/mikall-net" }
mikall-store = { path = "crates/mikall-store" }
mikall-node = { path = "crates/mikall-node" }
mikall-irc = { path = "crates/mikall-irc" }

thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false }
cucumber = "0.21"
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libp2p = { version = "0.56", default-features = false }
blake3 = "1.8"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
redb = "2"
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
iced = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
