[workspace]
resolver = "2"
members = [
    "crates/mikall-domain",
    "crates/mikall-app",
    "crates/mikall-bdd",
    "crates/mikall-crypto",
    "crates/mikall-net",
    "crates/mikall-store",
    "crates/mikall-node",
    "crates/mikall-irc",
    "crates/mikall-ui",
    "crates/mikall-media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guilhermesmartins/mikall"
rust-version = "1.85"

[workspace.dependencies]
mikall-domain = { path = "crates/mikall-domain" }
mikall-app = { path = "crates/mikall-app" }
mikall-crypto = { path = "crates/mikall-crypto" }
mikall-net = { path = "crates/mikall-net" }
mikall-store = { path = "crates/mikall-store" }
mikall-node = { path = "crates/mikall-node" }
mikall-irc = { path = "crates/mikall-irc" }
mikall-media = { path = "crates/mikall-media" }

thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false }
cucumber = "0.21"
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libp2p = { version = "0.56", default-features = false }
libp2p-stream = "0.4.0-alpha"
blake3 = "1.8"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
redb = "2"
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
iced = { version = "0.13", default-features = false }
chacha20poly1305 = "0.10"
audiopus = "0.2"
cpal = "0.15"
openh264 = "0.9"
scap = "0.1.0-beta.1"
# VideoToolbox hardware H.264 (macOS): the maintained objc2 framework
# bindings — typed CF smart pointers instead of hand-rolled FFI.
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Media hot paths must run at full speed even in `cargo run` dev builds:
# software H.264 at -O0 cannot hold a 100 ms frame budget, so sharing in a
# debug build lags unusably without these.
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.scap]
opt-level = 3
[profile.dev.package.objc2-core-foundation]
opt-level = 3
[profile.dev.package.objc2-core-media]
opt-level = 3
[profile.dev.package.objc2-core-video]
opt-level = 3
[profile.dev.package.objc2-video-toolbox]
opt-level = 3
[profile.dev.package.mikall-media]
opt-level = 3
[profile.dev.package.audiopus]
opt-level = 3
[profile.dev.package.audiopus_sys]
opt-level = 3
[profile.dev.package.cpal]
opt-level = 3
