[workspace]
resolver = "2"
members = [
    "crates/mikall-domain",
    "crates/mikall-app",
    "crates/mikall-bdd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guilhermesmartins/mikall"
rust-version = "1.85"

[workspace.dependencies]
mikall-domain = { path = "crates/mikall-domain" }
mikall-app = { path = "crates/mikall-app" }

thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false }
cucumber = "0.21"
proptest = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
