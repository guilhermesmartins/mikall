[package]
name = "mikall-ui"
description = "Driving adapter: the native iced GUI client (miku_teal theme). Drives NodeHandle only — no dependency on net, store, or crypto adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mikall-domain = { workspace = true }
mikall-app = { workspace = true }
mikall-node = { workspace = true }
mikall-irc = { workspace = true }
iced = { workspace = true, features = ["tokio", "wgpu", "tiny-skia", "web-colors", "auto-detect-theme"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "mikall"
path = "src/main.rs"

[lints]
workspace = true
